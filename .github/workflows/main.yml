name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      # ✅ 修复：添加 env 块
      - name: Debug certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "=== Secret 可用性检查 ==="
          
          # 检查长度（使用 shell 变量）
          echo "P12 Base64 length: ${#IOS_P12_BASE64}"
          echo "Password length: ${#IOS_P12_PASSWORD}"
          
          # 检查是否为空
          [ -z "$IOS_P12_BASE64" ] && echo "❌ P12 为空" || echo "✅ P12 已设置"
          [ -z "$IOS_P12_PASSWORD" ] && echo "❌ Password 为空" || echo "✅ Password 已设置"
          
          # 尝试解码（仅在非空时）
          if [ ! -z "$IOS_P12_BASE64" ]; then
            echo "$IOS_P12_BASE64" | base64 -D > test1.p12 2>&1 && echo "✅ 方式1成功" || echo "❌ 方式1失败"
            echo "$IOS_P12_BASE64" | tr -d '\n' | base64 -D > test2.p12 2>&1 && echo "✅ 方式2成功" || echo "❌ 方式2失败"
            
            # 检查文件
            ls -lh test*.p12 2>/dev/null || echo "❌ 未生成文件"
            file test*.p12 2>/dev/null || echo "❌ 文件类型检测失败"
          fi

      - name: Import iOS signing certificates
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          # 设置临时目录
          CERT_PATH=$RUNNER_TEMP/ios_sign.p12
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          
          # 解码证书（关键修复）
          echo "$IOS_P12_BASE64" | tr -d '\n\r' | base64 -D -o "$CERT_PATH"
          
          # 验证文件大小
          if [ -f "$CERT_PATH" ]; then
            echo "✅ 证书文件已生成"
            ls -lh "$CERT_PATH"
          else
            echo "❌ 证书文件生成失败"
            exit 1
          fi
          
          # 配置 keychain
          security create-keychain -p "" ios-build.keychain
          security list-keychains -d user -s ios-build.keychain
          security default-keychain -d user -s ios-build.keychain
          security unlock-keychain -p "" ios-build.keychain
          security set-keychain-settings -lut 21600 ios-build.keychain
          
          # 导入证书
          security import "$CERT_PATH" \
            -k ios-build.keychain \
            -P "$IOS_P12_PASSWORD" \
            -A
          
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "" \
            ios-build.keychain
          
          # 安装描述文件
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | tr -d '\n\r' | base64 -D > "$PROFILE_PATH/ios_profile.mobileprovision"

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Package
          path: build/ios/ipa/*.ipa
          retention-days: 90
