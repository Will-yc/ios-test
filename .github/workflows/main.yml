name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
      - name: Debug certificate
        run: |
          # 检查 Secret 是否为空
          echo "P12 Base64 length: ${#IOS_P12_BASE64}"
          echo "Password length: ${#IOS_P12_PASSWORD}"
          
          # 尝试不同的解码方式
          echo "$IOS_P12_BASE64" | base64 -D > test1.p12 2>&1 || echo "方式1失败"
          echo "$IOS_P12_BASE64" | tr -d '\n' | base64 -D > test2.p12 2>&1 || echo "方式2失败"
          
          # 检查文件类型
          file test*.p12


      - name: Import iOS signing certificates
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          # 设置临时目录
          CERT_PATH=$RUNNER_TEMP/ios_sign.p12
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          
          # 解码证书（关键修复）
          echo "$IOS_P12_BASE64" | tr -d '\n\r' | base64 -D -o "$CERT_PATH"
          
          # 验证文件大小
          ls -lh "$CERT_PATH"
          
          # 配置 keychain
          security create-keychain -p "" ios-build.keychain
          security list-keychains -d user -s ios-build.keychain
          security default-keychain -d user -s ios-build.keychain
          security unlock-keychain -p "" ios-build.keychain
          security set-keychain-settings -lut 21600 ios-build.keychain
          
          # 导入证书
          security import "$CERT_PATH" \
            -k ios-build.keychain \
            -P "$IOS_P12_PASSWORD" \
            -A
          
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "" \
            ios-build.keychain
          
          # 安装描述文件
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | tr -d '\n\r' | base64 -D > "$PROFILE_PATH/ios_profile.mobileprovision"

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Package
          path: build/ios/ipa/*.ipa
          retention-days: 90
