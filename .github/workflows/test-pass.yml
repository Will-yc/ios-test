name: Test iOS Certificate

on: workflow_dispatch

jobs:
  test-certificate:
    runs-on: macos-latest
    steps:
      - name: Test certificate import
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "=== 简单证书导入测试 ==="
          
          # 1. 解码证书
          echo "$IOS_P12_BASE64" | openssl base64 -d -A > cert.p12
          
          # 2. 测试证书密码
          echo "测试证书密码..."
          if openssl pkcs12 -in cert.p12 -nokeys -passin pass:"$IOS_P12_PASSWORD" 2>/dev/null; then
            echo "✅ 密码正确"
          else
            echo "❌ 密码错误"
            exit 1
          fi
          
          # 3. 导入到默认钥匙串
          echo "导入证书..."
          security import cert.p12 \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -T /usr/bin/security 2>&1
          
          # 4. 查看结果
          echo "可用签名证书:"
          security find-identity -v -p codesigning
          
          echo "=== 完成 ==="