name: Test iOS Certificate

on: workflow_dispatch

jobs:
  test-certificate:
    runs-on: macos-latest
    steps:
      - name: Test certificate import
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "=== 证书导入测试 ==="
          
          # 1. 解码证书
          echo "$IOS_P12_BASE64" | base64 -D > test_cert.p12
          echo "✅ 证书已解码"
          ls -lh test_cert.p12
          
          # 2. 创建新的 keychain
          KEYCHAIN_NAME="test.keychain"
          KEYCHAIN_PASSWORD="test123"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME"
          security default-keychain -d user -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 3. 导入证书（尝试不同的方法）
          echo "📤 导入证书..."
          
          # 方法1：直接导入
          echo "方法1：直接导入"
          security import test_cert.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign 2>&1
          
          # 4. 列出证书
          echo "📋 钥匙串中的证书:"
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"
          
          # 5. 检查证书类型
          echo "🔍 证书详细信息:"
          security find-certificate -c "iPhone" -p "$KEYCHAIN_NAME" | openssl x509 -text -noout | head -20 2>/dev/null || true
          
          echo "=== 测试完成 ==="