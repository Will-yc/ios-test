name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      # ✅ 改进的证书导入步骤（使用PEM格式）
      - name: Import iOS signing certificates
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          echo "=== 开始导入证书 ==="
          
          # 1. 解码证书为P12格式
          echo "解码P12证书..."
          echo "$IOS_P12_BASE64" | openssl base64 -d -A > distribution.p12
          
          # 2. 将P12转换为PEM格式
          echo "转换为PEM格式..."
          openssl pkcs12 -in distribution.p12 \
            -passin pass:"$IOS_P12_PASSWORD" \
            -nodes \
            -out temp.pem
          
          # 3. 创建临时钥匙串
          echo "创建临时钥匙串..."
          KEYCHAIN_PATH=~/Library/Keychains/ios-build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security list-keychains -d user -s ios-build.keychain login.keychain-db
          security default-keychain -d user -s ios-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security set-keychain-settings -lut 21600 ios-build.keychain
          
          # 4. 导入PEM格式证书到临时钥匙串
          echo "导入证书到钥匙串..."
          security import temp.pem \
            -k ios-build.keychain \
            -P "" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          
          # 5. 设置钥匙串分区列表（关键修复）
          echo "设置钥匙串权限..."
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            ios-build.keychain
          
          # 6. 显示可用签名证书
          echo "可用签名证书:"
          security find-identity -v -p codesigning ios-build.keychain
          
          # 7. 安装描述文件
          echo "安装描述文件..."
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | openssl base64 -d -A > "$PROFILE_PATH/ios_profile.mobileprovision"
          
          # 8. 解码描述文件查看信息
          echo "描述文件信息:"
          security cms -D -i "$PROFILE_PATH/ios_profile.mobileprovision" | grep -A 20 "Entitlements" || true
          
          echo "=== 证书导入完成 ==="
          
          # 9. 显示钥匙串详细信息
          echo "当前钥匙串列表:"
          security list-keychains
          
          echo "默认钥匙串:"
          security default-keychain

      # ✅ 设置Xcode版本
      - name: Set up Xcode version
        run: |
          echo "=== 设置Xcode版本 ==="
          
          # 设置默认Xcode版本
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          
          echo "当前Xcode信息:"
          xcode-select -p
          xcodebuild -version
          
          echo "可用SDKs:"
          xcodebuild -showsdks

      # ✅ 创建正确的ExportOptions.plist
      - name: Create Export Options Plist
        run: |
          echo "=== 创建 ExportOptions.plist ==="
          
          # 从描述文件中提取信息
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/ios_profile.mobileprovision
          
          # 提取UUID和Team ID
          UUID=$(grep -A1 -o '<key>UUID</key>.*<string>[^<]*</string>' "$PROFILE_PATH" | grep -o '<string>[^<]*</string>' | sed 's/<string>//;s/<\/string>//' | head -1)
          TEAM_ID=$(grep -A1 -o '<key>TeamIdentifier</key>.*<string>[^<]*</string>' "$PROFILE_PATH" | grep -o '<string>[^<]*</string>' | sed 's/<string>//;s/<\/string>//' | head -1)
          
          echo "提取的UUID: $UUID"
          echo "提取的Team ID: $TEAM_ID"
          
          # 创建 ExportOptions.plist - 使用自动签名，简化配置
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.zhiyuexctest.app</key>
                  <string>$UUID</string>
              </dict>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          
          echo "ExportOptions.plist 内容:"
          cat ios/ExportOptions.plist

      # ✅ 准备构建环境
      - name: Prepare build environment
        run: |
          echo "=== 准备构建环境 ==="
          
          # 检查钥匙串状态
          echo "当前钥匙串列表:"
          security list-keychains -d user
          
          echo "设置钥匙串搜索顺序..."
          security list-keychains -d user -s ios-build.keychain login.keychain-db
          
          echo "解锁钥匙串..."
          security unlock-keychain -p "" ios-build.keychain
          
          # 验证签名证书
          echo "验证签名证书..."
          security find-identity -v -p codesigning ios-build.keychain
          
          # 清理之前的构建
          flutter clean
          
          # 获取Flutter项目信息
          echo "Flutter项目信息:"
          flutter pub get
          flutter analyze
          
          # 检查iOS项目配置
          echo "检查iOS项目配置..."
          cd ios
          xcodebuild -project Runner.xcodeproj -showBuildSettings | grep -i "bundle\|provision\|sign" || true
          cd ..

      # ✅ 构建iOS IPA - 详细日志
      - name: Build iOS IPA
        run: |
          echo "=== 开始构建IPA ==="
          
          # 设置环境变量
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          
          # 解锁钥匙串
          security unlock-keychain -p "" ios-build.keychain
          
          # 验证证书
          echo "验证证书可用性..."
          security find-identity -v -p codesigning | grep "Distribution"
          
          # 显示构建配置
          echo "检查构建配置..."
          flutter doctor -v
          
          echo "检查iOS构建配置..."
          cd ios
          xcodebuild -project Runner.xcodeproj -scheme Runner -showBuildSettings | grep -E "(PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY)" || true
          cd ..
          
          # 使用详细的构建命令，捕获所有输出
          echo "开始构建Release IPA..."
          
          # 保存构建日志
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --verbose 2>&1 | tee build.log || (echo "构建失败，查看日志..." && cat build.log && exit 1)
          
          # 检查构建结果
          echo "检查构建输出..."
          if [ -f "build/ios/ipa/Runner.ipa" ]; then
            echo "✅ IPA构建成功！"
            ls -lh build/ios/ipa/
          else
            echo "❌ IPA文件未找到"
            find . -name "*.ipa" -type f 2>/dev/null || echo "未找到任何IPA文件"
            exit 1
          fi

      # ✅ 上传IPA文件
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOS-IPA
          path: |
            build/ios/ipa/*.ipa
          retention-days: 7
          
      # ✅ 上传构建日志（便于调试）
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
          retention-days: 7name: Build Flutter iOS IPA

