name: Flutter iOS Build

on:
  workflow_dispatch: # 允许手动触发
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-release.yml'

jobs:
  build_ios_ipa:
    runs-on: macos-latest
    env:
      BUILD_SCHEME: Runner
      BUILD_CONFIGURATION: Release
      EXPORT_METHOD: ad-hoc # app-store, ad-hoc, enterprise, development
      FLUTTER_VERSION: '3.38.5'

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}

      # 3. 获取依赖
      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      # 4. 安装 Apple 证书（使用官方认证的 Action）
      - name: Install Apple certificate and provisioning profile
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          # 此 Action 会自动安装证书到临时钥匙链

      # 5. 安装描述文件
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -eo pipefail
          
          # 创建临时文件
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          
          # 解码描述文件（macOS 使用 base64 -d）
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PP_PATH"
          
          # 验证解码结果
          if [ ! -s "$PP_PATH" ]; then
            echo "❌ 描述文件解码失败"
            exit 1
          fi
          
          # 获取描述文件 UUID
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          echo "📱 描述文件 UUID: $UUID"
          
          # 安装到标准位置（使用 UUID 作为文件名）
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          
          echo "✅ 描述文件安装成功: ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision"
          
          # 验证安装
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ | head -10

      # 6. 构建未签名的 Flutter 应用
      - name: Build Flutter iOS (unsigned)
        run: |
          echo "🛠️  构建未签名的 iOS 应用..."
          flutter build ios --release --no-codesign
          echo "✅ 未签名构建完成"

      # 7. 创建 ExportOptions.plist 文件
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ env.EXPORT_METHOD }}</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.IOS_BUNDLE_ID }}</key>
                  <string>${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          
          echo "📄 ExportOptions.plist 内容:"
          cat ios/ExportOptions.plist

      # 8. 生成 xcarchive
      - name: Build xcarchive
        env:
          BUILD_PATH: build/ios
        run: |
          echo "📦 生成 xcarchive..."
          
          # 清理旧构建
          rm -rf "$BUILD_PATH" || true
          
          # 构建 xcarchive
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme "$BUILD_SCHEME" \
                     -configuration "$BUILD_CONFIGURATION" \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$BUILD_PATH/archive/Runner.xcarchive" \
                     DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
                     PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}" \
                     CODE_SIGN_STYLE="Manual" \
                     clean archive
          
          echo "✅ xcarchive 生成完成"
          ls -lh "$BUILD_PATH/archive/"

      # 9. 导出 IPA 文件
      - name: Export IPA
        run: |
          echo "🚀 导出 IPA 文件..."
          
          # 导出 IPA
          xcodebuild -exportArchive \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     -exportPath build/ios/ipa \
                     -exportOptionsPlist ios/ExportOptions.plist \
                     -allowProvisioningUpdates
          
          echo "✅ IPA 导出完成"
          
          # 列出生成的 IPA 文件
          echo "📱 生成的 IPA 文件:"
          ls -lh build/ios/ipa/*.ipa

      # 10. 验证代码签名
      - name: Verify code signing
        run: |
          echo "🔐 验证代码签名..."
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            exit 1
          fi
          
          # 解压 IPA 查看签名
          TEMP_DIR="$RUNNER_TEMP/ipa_check"
          mkdir -p "$TEMP_DIR"
          unzip -q "$IPA_PATH" -d "$TEMP_DIR"
          
          # 检查签名
          codesign -dv --verbose=4 "$TEMP_DIR/Payload/Runner.app" 2>&1 | grep -A5 -B5 "Authority" || true
          
          echo "✅ 签名验证完成"

      # 11. 上传构建产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 90
          if-no-files-found: error

      # 12. 上传构建日志
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/flutter_build.log
            ${{ github.workspace }}/ios_build.log
          retention-days: 30