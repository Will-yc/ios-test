name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    
    env:
      KEYCHAIN_NAME: "ios-build.keychain-db"
      KEYCHAIN_PASSWORD: "ci-keychain-password-12345"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Import iOS signing certificates
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          
          # 解码P12
          echo "$IOS_P12_BASE64" | base64 --decode > /tmp/distribution.p12
          
          # 验证P12
          openssl pkcs12 -in /tmp/distribution.p12 \
            -passin pass:"$IOS_P12_PASSWORD" -noout
          echo "✅ P12文件有效"
          
          # 创建钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_NAME"
          
          # 导入P12
          security import /tmp/distribution.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12
          
          # 设置权限
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 验证
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"
          
          # 安装描述文件
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/ios_profile.mobileprovision"
          
          # 提取描述文件信息
          PLIST=$(security cms -D -i "$PROFILE_DIR/ios_profile.mobileprovision" 2>/dev/null)
          
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< "$PLIST")
          
          echo "UUID: $PROFILE_UUID"
          echo "Name: $PROFILE_NAME"
          echo "Team: $TEAM_ID"
          
          # 用UUID命名描述文件
          cp "$PROFILE_DIR/ios_profile.mobileprovision" \
             "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          
          # 保存环境变量
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
          rm -f /tmp/distribution.p12

      - name: Set up Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      # ✅✅✅ 关键步骤：修改Xcode项目签名配置 ✅✅✅
      - name: Configure Xcode project signing
        run: |
          echo "=== 配置Xcode项目为手动签名 ==="
          
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          
          # 备份
          cp "$PBXPROJ" "$PBXPROJ.bak"
          
          # 1. 替换所有 Automatic 为 Manual
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          sed -i '' 's/ProvisioningStyle = Automatic/ProvisioningStyle = Manual/g' "$PBXPROJ"
          
          # 2. 替换 DEVELOPMENT_TEAM
          if grep -q "DEVELOPMENT_TEAM" "$PBXPROJ"; then
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = $TEAM_ID/g" "$PBXPROJ"
          fi
          
          # 3. 替换 CODE_SIGN_IDENTITY
          #    需要同时处理 Debug 和 Release
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution"/g' "$PBXPROJ"
          
          # 4. 如果项目中有通用的 CODE_SIGN_IDENTITY
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*"/CODE_SIGN_IDENTITY = "iPhone Distribution"/g' "$PBXPROJ"
          # 修复可能被过度替换的情况（空字符串的保留）
          
          # 5. 添加或替换 PROVISIONING_PROFILE_SPECIFIER
          if grep -q "PROVISIONING_PROFILE_SPECIFIER" "$PBXPROJ"; then
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\"/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\"/g" "$PBXPROJ"
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"\"/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\"/g" "$PBXPROJ"
          fi
          
          # 6. 使用Python精确修改（更可靠）
          python3 << 'PYEOF'
          import re
          import os
          
          pbxproj_path = "ios/Runner.xcodeproj/project.pbxproj"
          profile_uuid = os.environ.get("PROFILE_UUID", "")
          team_id = os.environ.get("TEAM_ID", "")
          
          with open(pbxproj_path, 'r') as f:
              content = f.read()
          
          # 确保所有buildSettings块中有正确的签名配置
          # 查找Release配置块并注入设置
          
          # 替换所有 CODE_SIGN_STYLE
          content = content.replace(
              'CODE_SIGN_STYLE = Automatic',
              'CODE_SIGN_STYLE = Manual'
          )
          
          # 替换 ProvisioningStyle
          content = content.replace(
              'ProvisioningStyle = Automatic',
              'ProvisioningStyle = Manual'
          )
          
          # 在每个包含 PRODUCT_BUNDLE_IDENTIFIER 的 buildSettings 块中
          # 确保有 PROVISIONING_PROFILE_SPECIFIER
          lines = content.split('\n')
          new_lines = []
          in_build_settings = False
          has_provisioning = False
          brace_count = 0
          
          for i, line in enumerate(lines):
              new_lines.append(line)
              
              if 'buildSettings' in line and '{' in line:
                  in_build_settings = True
                  has_provisioning = False
                  brace_count = 1
              elif in_build_settings:
                  brace_count += line.count('{') - line.count('}')
                  
                  if 'PROVISIONING_PROFILE_SPECIFIER' in line:
                      has_provisioning = True
                  
                  if brace_count <= 0:
                      in_build_settings = False
                      if not has_provisioning:
                          # 在闭合括号前插入
                          indent = '\t\t\t\t'
                          new_lines.insert(-1, f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";')
                          new_lines.insert(-1, f'{indent}"PROVISIONING_PROFILE[sdk=iphoneos*]" = "{profile_uuid}";')
          
          content = '\n'.join(new_lines)
          
          with open(pbxproj_path, 'w') as f:
              f.write(content)
          
          print(f"✅ 已配置签名: Team={team_id}, Profile={profile_uuid}")
          PYEOF
          
          echo ""
          echo "验证修改结果:"
          echo "--- CODE_SIGN_STYLE ---"
          grep "CODE_SIGN_STYLE" "$PBXPROJ" | head -5
          echo "--- DEVELOPMENT_TEAM ---"
          grep "DEVELOPMENT_TEAM" "$PBXPROJ" | head -5
          echo "--- CODE_SIGN_IDENTITY ---"
          grep "CODE_SIGN_IDENTITY" "$PBXPROJ" | head -5
          echo "--- PROVISIONING_PROFILE ---"
          grep "PROVISIONING_PROFILE" "$PBXPROJ" | head -5
          echo "--- ProvisioningStyle ---"
          grep "ProvisioningStyle" "$PBXPROJ" | head -5

      - name: Create Export Options
        run: |
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>method</key>
              <string>ad-hoc</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.zhiyuexctest.app</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          
          cat ios/ExportOptions.plist

      - name: Build iOS IPA
        run: |
          # 确保钥匙串解锁
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 验证证书
          echo "签名证书:"
          security find-identity -v -p codesigning
          
          # 构建（不再 flutter clean，前面已经 pub get）
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true