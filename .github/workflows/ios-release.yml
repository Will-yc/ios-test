        run: |
          echo "清理临时钥匙串..."
          # 恢复默认钥匙串
          security list-keychains -d user -s login.keychain-db
          security default-keychain -d user -s login.keychain-db
          # 删除临时钥匙串
          security delete-keychain ios-build.keychain 2>/dev/null || true
          rm -f distribution.p12 temp.pem 2>/dev/null || true

      # ✅ 上传IPA
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: |
            build/ios/ipa/*.ipa
            build/ios/Runner.xcarchive
          retention-days: 90

      # ✅ 上传日志（如果失败）
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            ios/xcodebuild_archive.log
            ios/xcodebuild_export.log
            flutter_build.log
          retention-days: 30