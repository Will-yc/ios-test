name: iOS Build with Auto Signing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        channel: 'stable'
    
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
    
    - name: Configure iOS auto signing
      run: |
        cd ios
        # 修改Xcode项目配置使用自动签名
        sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "";/g' Runner.xcodeproj/project.pbxproj
        sed -i '' 's/PROVISIONING_PROFILE = "";/PROVISIONING_PROFILE = "";/g' Runner.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Runner.xcodeproj/project.pbxproj
        sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "${{ secrets.IOS_TEAM_ID }}";/g' Runner.xcodeproj/project.pbxproj
    
    - name: Build iOS app with auto signing
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
      run: |
        # 安装fastlane（可选）
        # sudo gem install fastlane -NV
        
        # 使用Flutter构建
        flutter build ipa --release --flavor production
        
        # 或者使用fastlane（需要配置Fastfile）
        # cd ios
        # fastlane beta
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App
        path: |
          build/ios/ipa/*.ipa
          build/ios/*.app
        retention-days: 30