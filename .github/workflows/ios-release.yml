name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    
    # ✅ 在 job 级别定义环境变量，所有 step 共享
    env:
      KEYCHAIN_NAME: "ios-build.keychain-db"
      KEYCHAIN_PASSWORD: "ci-keychain-password-12345"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      # ✅ 修复：直接导入P12，不转PEM
      - name: Import iOS signing certificates
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          echo "=== 开始导入证书 ==="

          # 1. 解码P12证书文件
          echo "$IOS_P12_BASE64" | base64 --decode > /tmp/distribution.p12
          echo "✅ P12文件大小: $(wc -c < /tmp/distribution.p12) bytes"

          # 2. 验证P12文件有效性
          echo "验证P12文件..."
          openssl pkcs12 -in /tmp/distribution.p12 \
            -passin pass:"$IOS_P12_PASSWORD" \
            -noout 2>&1 && echo "✅ P12文件有效" || {
            echo "❌ P12文件无效或密码错误"
            exit 1
          }

          # 3. 显示P12中的证书信息（调试用）
          echo "P12证书信息:"
          openssl pkcs12 -in /tmp/distribution.p12 \
            -passin pass:"$IOS_P12_PASSWORD" \
            -nokeys -clcerts | openssl x509 -noout -subject -issuer -dates 2>/dev/null || true

          # 4. 创建临时钥匙串（使用固定密码，确保一致性）
          echo "创建临时钥匙串..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 5. 将临时钥匙串添加到搜索列表（保留login钥匙串）
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')
          
          # 6. 设为默认钥匙串
          security default-keychain -d user -s "$KEYCHAIN_NAME"
          
          # 7. 解锁钥匙串
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 8. 设置超时时间（6小时）
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_NAME"

          # 9. ✅ 关键修复：直接导入P12文件（不转PEM）
          echo "导入P12证书到钥匙串..."
          security import /tmp/distribution.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign \
            -f pkcs12

          # 10. ✅ 关键修复：设置钥匙串分区列表
          echo "设置钥匙串访问权限..."
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"

          # 11. 验证证书已导入
          echo ""
          echo "========================================="
          echo "✅ 已导入的代码签名证书:"
          echo "========================================="
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"
          
          CERT_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -c "valid identities found" || true)
          echo "证书数量检查: $CERT_COUNT"
          
          # 确保至少有一个有效证书
          if security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -q "0 valid identities found"; then
            echo "❌ 没有找到有效的签名证书！"
            echo ""
            echo "调试信息 - 钥匙串中所有证书:"
            security find-identity "$KEYCHAIN_NAME"
            echo ""
            echo "调试信息 - 所有钥匙串中的签名证书:"
            security find-identity -v -p codesigning
            exit 1
          fi

          # 12. 安装描述文件
          echo ""
          echo "安装描述文件..."
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/ios_profile.mobileprovision"
          echo "✅ 描述文件大小: $(wc -c < "$PROFILE_DIR/ios_profile.mobileprovision") bytes"

          # 13. 提取描述文件信息
          echo ""
          echo "========================================="
          echo "📋 描述文件信息:"
          echo "========================================="
          
          # 提取UUID
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            "$(security cms -D -i "$PROFILE_DIR/ios_profile.mobileprovision" 2>/dev/null)")
          echo "UUID: $PROFILE_UUID"
          
          # 提取名称
          PROFILE_DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< \
            "$(security cms -D -i "$PROFILE_DIR/ios_profile.mobileprovision" 2>/dev/null)")
          echo "Name: $PROFILE_DISPLAY_NAME"
          
          # 提取TeamID
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< \
            "$(security cms -D -i "$PROFILE_DIR/ios_profile.mobileprovision" 2>/dev/null)")
          echo "TeamID: $TEAM_ID"
          
          # 提取BundleID
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin <<< \
            "$(security cms -D -i "$PROFILE_DIR/ios_profile.mobileprovision" 2>/dev/null)")
          echo "AppID: $APP_ID"
          
          # 用UUID重命名描述文件（Xcode期望的格式）
          cp "$PROFILE_DIR/ios_profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "✅ 描述文件已复制为: $PROFILE_UUID.mobileprovision"
          
          # 保存变量供后续步骤使用
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_DISPLAY_NAME" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

          # 清理临时文件
          rm -f /tmp/distribution.p12
          
          echo ""
          echo "=== ✅ 证书和描述文件导入完成 ==="

      # ✅ 设置Xcode版本
      - name: Set up Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          echo "Xcode: $(xcodebuild -version)"

      # ✅ 创建 ExportOptions.plist（使用动态提取的值）
      - name: Create Export Options Plist
        run: |
          echo "=== 创建 ExportOptions.plist ==="
          echo "使用 TeamID: $TEAM_ID"
          echo "使用 Profile Name: $PROFILE_NAME"
          echo "使用 Profile UUID: $PROFILE_UUID"
          
          # 从Xcode项目中提取Bundle ID
          BUNDLE_ID=$(grep -A1 'PRODUCT_BUNDLE_IDENTIFIER' ios/Runner.xcodeproj/project.pbxproj \
            | grep -oE '[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)+' | head -1)
          
          # 如果提取失败，使用默认值
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.zhiyuexctest.app"
          fi
          echo "使用 BundleID: $BUNDLE_ID"
          
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          
          echo ""
          echo "生成的 ExportOptions.plist:"
          cat ios/ExportOptions.plist

      # ✅ 构建iOS IPA
      - name: Build iOS IPA
        run: |
          echo "=== 开始构建IPA ==="
          
          # 确保钥匙串仍然解锁
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 再次验证证书
          echo "可用签名证书:"
          security find-identity -v -p codesigning
          
          # 清理
          flutter clean
          flutter pub get
          
          # 构建
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist
          
          echo ""
          echo "=== 构建输出 ==="
          ls -la build/ios/ipa/ 2>/dev/null || echo "未找到IPA目录"
          find build -name "*.ipa" -type f 2>/dev/null || echo "未找到IPA文件"

      # ✅ 上传IPA文件
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 7

      # ✅ 清理钥匙串（始终执行）
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          rm -f /tmp/distribution.p12