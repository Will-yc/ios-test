name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      # ✅ 检查可用的Xcode版本
      - name: List available Xcode versions
        run: |
          echo "可用的Xcode版本:"
          ls -d /Applications/Xcode*.app || true
          
          # 列出所有可用的Xcode
          echo "=== 所有可用Xcode ==="
          ls -la /Applications/ | grep -i xcode || true
          
          # 检查特定版本是否存在
          echo "=== 检查特定版本 ==="
          [ -d "/Applications/Xcode_15.4.app" ] && echo "✅ Xcode 15.4 存在"
          [ -d "/Applications/Xcode_15.3.app" ] && echo "✅ Xcode 15.3 存在"
          [ -d "/Applications/Xcode_15.2.app" ] && echo "✅ Xcode 15.2 存在"
          [ -d "/Applications/Xcode_15.1.app" ] && echo "✅ Xcode 15.1 存在"
          [ -d "/Applications/Xcode_15.0.app" ] && echo "✅ Xcode 15.0 存在"
          [ -d "/Applications/Xcode.app" ] && echo "✅ 默认Xcode 存在"
          
          # 显示当前选择的Xcode
          echo "=== 当前选择的Xcode ==="
          xcode-select -p

      # ✅ 改进的证书导入步骤（使用PEM格式）
      - name: Import iOS signing certificates
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          echo "=== 开始导入证书 ==="
          
          # 1. 创建临时钥匙串
          echo "创建临时钥匙串..."
          security create-keychain -p "" ios-build.keychain
          security list-keychains -d user -s ios-build.keychain
          security default-keychain -d user -s ios-build.keychain
          security unlock-keychain -p "" ios-build.keychain
          security set-keychain-settings -lut 21600 ios-build.keychain
          
          # 2. 解码证书为P12格式
          echo "解码P12证书..."
          echo "$IOS_P12_BASE64" | openssl base64 -d -A > distribution.p12
          
          # 3. 将P12转换为PEM格式
          echo "转换为PEM格式..."
          openssl pkcs12 -in distribution.p12 \
            -passin pass:"$IOS_P12_PASSWORD" \
            -nodes \
            -out temp.pem
          
          # 4. 导入PEM格式证书到临时钥匙串
          echo "导入证书到钥匙串..."
          security import temp.pem \
            -k ios-build.keychain \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          
          # 5. 设置钥匙串分区列表（允许构建工具访问）
          echo "设置钥匙串权限..."
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "" \
            ios-build.keychain
          
          # 6. 显示可用签名证书
          echo "可用签名证书:"
          security find-identity -v -p codesigning ios-build.keychain
          
          # 7. 安装描述文件
          echo "安装描述文件..."
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | openssl base64 -d -A > "$PROFILE_PATH/ios_profile.mobileprovision"
          
          echo "证书文件信息:"
          ls -lh distribution.p12 temp.pem
          echo "描述文件信息:"
          ls -lh "$PROFILE_PATH/ios_profile.mobileprovision"
          
          echo "=== 证书导入完成 ==="

      # ✅ 改进的Xcode设置步骤
      - name: Set up Xcode version
        run: |
          echo "=== 设置Xcode版本 ==="
          
          # 检查可用的Xcode版本并设置
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            echo "使用 Xcode 15.4"
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            echo "使用 Xcode 15.3"
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            echo "使用 Xcode 15.2"
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.1.app" ]; then
            echo "使用 Xcode 15.1"
            sudo xcode-select -s /Applications/Xcode_15.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.0.app" ]; then
            echo "使用 Xcode 15.0"
            sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "使用默认 Xcode 版本"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            echo "❌ 未找到任何Xcode版本"
            ls -la /Applications/
            exit 1
          fi
          
          echo "当前Xcode信息:"
          xcode-select -p
          xcodebuild -version

      # ✅ 可选：使用setup-xcode action来管理Xcode版本
      # - name: Setup Xcode
      #   uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: '15.3'  # 或者 'latest', 'stable'

      - name: Build iOS IPA
        run: |
          echo "开始构建IPA..."
          
          # 设置临时钥匙串为默认
          security default-keychain -d user -s ios-build.keychain
          
          # 验证签名配置
          echo "验证代码签名配置..."
          cd ios
          xcodebuild -showBuildSettings | grep -i code
          cd ..
          
          # 构建IPA
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --verbose
          
          echo "构建完成，检查生成的IPA..."
          ls -lh build/ios/ipa/

      - name: Clean up keychain (可选)
        if: always()
        run: |
          echo "清理临时钥匙串..."
          security delete-keychain ios-build.keychain 2>/dev/null || true
          rm -f distribution.p12 temp.pem 2>/dev/null || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Package
          path: build/ios/ipa/*.ipa
          retention-days: 90